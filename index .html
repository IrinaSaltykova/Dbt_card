<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дневниковая карточка ДПТ</title>
<style>
:root{--a:#4f7a6a;--bg:#f5f3ee;--c:#fff;--t:#24302c;--l:#d9ded9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:16px 16px 40px}h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:0 0 10px}
nav{position:sticky;top:0;background:var(--bg);display:flex;gap:6px;padding:8px 0}
button{font:inherit;border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:12px;padding:9px 12px;cursor:pointer}
nav button{flex:1;padding:9px 2px;font-size:14px}button.on{background:var(--a);border-color:var(--a);color:#fff}
section{background:var(--c);border-radius:16px;padding:14px;margin:12px 0}
.q{margin:12px 0}.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.num button{flex:1;min-width:34px;padding:8px 0}
input,textarea,select{font:inherit;width:100%;padding:9px;border:1px solid var(--l);border-radius:10px;background:#fff;color:var(--t);margin-top:6px}
.warn{background:#fdeee6;border-radius:12px;padding:12px;font-size:14px}small{color:#66736e}pre{white-space:pre-wrap;font:14px/1.5 system-ui,sans-serif}
</style></head><body><main>
<h1>Дневниковая карточка ДПТ</h1>
<div class="warn">Карточку никто не видит, пока вы не отправите отчёт. Если побуждение сильное, не ждите сессии — действуйте по своему плану безопасности. При опасности для жизни звоните 112.</div>
<label class="q">Псевдоним<input id="name"></label><label class="q">Дата<input type="date" id="date"></label>
<nav id="nav"></nav><div id="view"></div>
</main><script>
const KEY="dbtCard";let db={name:"",days:{},weeks:{}},ok=true;
try{db=JSON.parse(localStorage.getItem(KEY))||db}catch(e){ok=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){ok=false;alert("Браузер не сохраняет записи. Откройте ссылку в обычном браузере.")}}
const scale=[0,1,2,3,4,5],yn=["да","нет"];
const DAY=[["Побуждения (0–5)",[["u1","К самоубийству",scale],["u2","К самоповреждению",scale],["u3","К приёму веществ",scale]]],
["Высший уровень за день (0–5)",[["r1","Опустошённость",scale],["r2","Физическая усталость",scale],["r3","Радость",scale]]],
["Вещества",[["s1","Алкоголь: сколько и какой"],["s2","Наркотики: сколько и какие"],["s3","Рецептурные препараты",yn],["s4","Без рецепта: сколько и какие"]]],
["Действия",[["a1","Самоповреждение",yn],["a2","Ложь: сколько раз"]]],
["Эмоции и дополнительно",[["e1","Эмоции"],["e2","Дополнительно"],["e3","Дополнительный комментарий"]]]];
const USE=["u","Применение навыков",[0,1,2,3,4,5,6,7]];
const HINT="0 не думал(а), не применял(а) · 1 думал(а), не применял(а), не хотел(а) · 2 думал(а), не применял(а), хотел(а) · 3 пытался(ась), не получилось · 4 получилось, не помогло · 5 получилось, помогло · 6 автоматически, не помогло · 7 автоматически, помогло";
const SK=[["Осознанность","Мудрый разум|Наблюдение|Описание|Участие|Безоценочность|Однонаправленность|Эффективность"],
["Межличностная эффективность","ПОПРОСИ|ДРУГ|ЧЕСТЬ|Срединный путь, диалектика|Валидация|Стратегии изменения поведения"],
["Эмоциональная регуляция","Проверка фактов|Противоположное действие|Решение проблем|Накопление положительных эмоций (A)|Мастерство (B)|Справляться заранее (C)|ЗАБОТА|Осознанность к текущим эмоциям"],
["Стрессоустойчивость","СТОП|«За» и «против»|ТРУД|ПЕРЕЖИТЬ|Самоуспокоение|ПОПРАВЬте момент|Радикальное принятие|Полуулыбка, ладони готовности|Готовность, осознанность к текущим мыслям"],
["Анализ поведения","Анализ пропущенного звена|Анализ поведенческой цепочки"]];
const WEEK=[["w1","Заполняю во время сессии",yn],["w4","Изменения в приёме медикаментов"],
["w6","Побуждение бросить психотерапию",scale],["w9","Могу регулировать эмоции",scale],["w10","Могу регулировать действия",scale],["w11","Могу регулировать мысли",scale],["w13","Комментарии"]];
// настройки карточки конкретного клиента берутся из ссылки (#c=...)
const FULL=DAY.map(([t,f])=>[t,f.slice()]);let weekOn=true,badLink=false,trOn=false;
const enc=o=>btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const dec=t=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(t.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0))));
const TYPES={n:scale,y:yn,t:undefined};
if(location.hash.startsWith("#c="))try{const c=dec(location.hash.slice(3));
 const own=c.add.map(([name,type])=>["c:"+name,name,TYPES[type]]);
 const kept=FULL.map(([t,f])=>[t,f.filter(x=>c.on.includes(x[0]))]).filter(g=>g[1].length);
 if(own.length)kept.push(["Личные пункты",own]);DAY.splice(0,DAY.length,...kept);weekOn=!!c.w;trOn=!!c.tr}catch(e){badLink=true}
onhashchange=()=>location.reload();
const $=s=>document.querySelector(s),el=(t,p,x)=>{const e=document.createElement(t);if(x!==undefined)e.textContent=x;p.append(e);return e};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
$("#date").value=iso(new Date());$("#name").value=db.name;
$("#name").oninput=e=>{db.name=e.target.value;save()};$("#date").onchange=()=>draw();
const TABS=[["День",0],["Навыки",1],["Неделя",2],["Отчёт",3]].filter(([,i])=>(i!==0||DAY.length||trOn)&&(i!==2||weekOn));let tab=TABS[0][1];
const rec=s=>db[s][$("#date").value]||{};
function put(s,k,v){const d=$("#date").value;db[s][d]=db[s][d]||{};if(v===""||v===undefined||(Array.isArray(v)&&!v.length))delete db[s][d][k];else db[s][d][k]=v;save()}
function field(p,store,[k,title,opts]){const box=el("div",p);box.className="q";el("div",box,title);
 if(!opts){const i=el("textarea",box);i.rows=1;i.value=rec(store)[k]||"";i.oninput=()=>put(store,k,i.value);return}
 const r=el("div",box);r.className="row"+(opts.length>4?" num":"");
 opts.forEach(o=>{const b=el("button",r,o);if(rec(store)[k]===o)b.className="on";b.onclick=()=>{put(store,k,rec(store)[k]===o?undefined:o);draw()}})}
function thoughts(s){const t=rec("days").tr||{em:[],th:[],hot:null};
 const keep=()=>put("days","tr",t.em.length||t.th.length?t:undefined);
 const block=(title,key,hint,scaleName,addText)=>{el("h2",s,title);t[key].forEach((row,i)=>{const box=el("div",s);box.className="q";
   const name=el("input",box);name.placeholder=hint;name.value=row[0];name.oninput=()=>{row[0]=name.value;keep()};
   const val=el("small",box,scaleName+": "+row[1]+"%"),bar=el("input",box);bar.type="range";bar.min=0;bar.max=100;bar.step=5;bar.value=row[1];bar.style.accentColor="var(--a)";
   bar.oninput=()=>{row[1]=+bar.value;val.textContent=scaleName+": "+bar.value+"%";keep()};
   const r=el("div",box);r.className="row";
   if(key==="th"){const h=el("button",r,t.hot===i?"★ Самая заряженная":"☆ Самая заряженная");if(t.hot===i)h.className="on";h.onclick=()=>{t.hot=t.hot===i?null:i;keep();draw()}}
   el("button",r,"Убрать").onclick=()=>{t[key].splice(i,1);if(key==="th"&&t.hot!==null){if(t.hot===i)t.hot=null;else if(t.hot>i)t.hot--}keep();draw()}});
  el("button",s,addText).onclick=()=>{t[key].push(["",50]);keep();draw()}};
 block("Эмоции","em","Какая эмоция?","Сила","+ Эмоция");block("Мысли","th","Какая мысль?","Насколько верю","+ Мысль")}
function report(){const end=new Date($("#date").value+"T12:00");let out=["Дневниковая карточка ДПТ","Клиент: "+(db.name||"—")];
 const labels={};DAY.forEach(g=>g[1].forEach(f=>labels[f[0]]=f[1]));const long={u1:"Побуждение к самоубийству",u2:"Побуждение к самоповреждению",u3:"Побуждение к веществам"};Object.keys(long).forEach(k=>{if(labels[k])labels[k]=long[k]});labels.u=USE[1];
 for(let i=6;i>=0;i--){const d=new Date(end);d.setDate(d.getDate()-i);const k=iso(d),r=db.days[k];out.push("",d.toLocaleDateString("ru-RU",{weekday:"short",day:"2-digit",month:"2-digit"}));
  if(!r||!Object.keys(r).length){out.push("нет записей");continue}
  Object.keys(labels).forEach(f=>{if(r[f]!==undefined)out.push(labels[f]+": "+r[f])});if(r.tr){r.tr.em.forEach(x=>out.push("Эмоция: "+(x[0]||"без названия")+", "+x[1]+"%"));r.tr.th.forEach((x,i)=>out.push((r.tr.hot===i?"★ Самая заряженная мысль: ":"Мысль: ")+(x[0]||"без текста")+", верю на "+x[1]+"%"))}if(r.skills)out.push("Навыки: "+r.skills.join(", "))}
 const w=rec("weeks");if(weekOn)out.push("","ИТОГИ НЕДЕЛИ");WEEK.forEach(f=>{if(w[f[0]]!==undefined)out.push(f[1]+": "+w[f[0]])});return out.join("\n")}
function draw(){const n=$("#nav");n.textContent="";TABS.forEach(([t,i])=>{const b=el("button",n,t);b.className=i===tab?"on":"";b.onclick=()=>{tab=i;draw()}});
 const v=$("#view");const y=scrollY;v.textContent="";
 const sec=t=>{const s=el("section",v);el("h2",s,t);return s};
 if(tab===0)DAY.forEach(([t,f])=>{const s=sec(t);f.forEach(x=>field(s,"days",x))});
 if(tab===0&&trOn)thoughts(sec("Эмоции и мысли"));
 if(tab===1){const u=sec("За день (0–7)");field(u,"days",USE);el("small",u,HINT);
  SK.forEach(([t,list])=>{const s=sec(t),r=el("div",s);r.className="row";list.split("|").forEach(name=>{const cur=rec("days").skills||[],b=el("button",r,name);if(cur.includes(name))b.className="on";
   b.onclick=()=>{put("days","skills",cur.includes(name)?cur.filter(x=>x!==name):[...cur,name]);draw()}})})}
 if(tab===2){const s=sec("Итоги недели");el("small",s,"Поставьте дату сессии и заполните один раз.");WEEK.forEach(x=>field(s,"weeks",x))}
 if(tab===3){const s=sec("7 дней до выбранной даты");const text=report();const r=el("div",s);r.className="row";
  const c=el("button",r,"Скопировать отчёт");c.className="on";c.onclick=()=>navigator.clipboard.writeText(text).then(()=>c.textContent="Скопировано ✓",()=>alert("Выделите текст ниже и скопируйте вручную"));
  if(navigator.share)el("button",r,"Отправить…").onclick=()=>navigator.share({text}).catch(()=>{});
  el("pre",s,text);el("button",s,"Удалить все мои записи").onclick=()=>{if(confirm("Удалить без восстановления?")){db={name:"",days:{},weeks:{}};save();$("#name").value="";draw()}}}
 scrollTo(0,y)}
function builder(){const m=$("main");m.textContent="";el("h1",m,"Конструктор карточки");
 el("small",m,"Отметьте, что видит клиент. Навыки и применение навыков есть всегда.");
 const sec=t=>{const s=el("section",m);el("h2",s,t);return s};
 const check=(p,text,on)=>{const l=el("label",p);l.className="q";l.style.display="block";const i=el("input",l);i.type="checkbox";i.checked=on;i.style.width="auto";i.style.marginRight="8px";l.append(text);return i};
 const boxes=[];FULL.forEach(([t,f])=>{const s=sec(t);f.forEach(([k,title])=>boxes.push([k,check(s,title,false)]))});
 const w=check(sec("Раз в неделю"),"Вкладка «Неделя» целиком (в ней есть побуждения)",false);
 const tr=check(sec("Дневник мыслей"),"Эмоции и мысли в процентах, самая заряженная мысль",false);
 const s=sec("Свои пункты"),list=el("div",s),rows=[];
 const addRow=()=>{const r=el("div",list);r.className="q";const name=el("input",r);name.placeholder="Например: Вина";const type=el("select",r);
  [["n","Шкала 0–5"],["y","Да / нет"],["t","Текст"]].forEach(([v,t])=>el("option",type,t).value=v);rows.push([name,type])};
 addRow();el("button",s,"+ Ещё пункт").onclick=addRow;
 const out=sec("Ссылка для клиента"),make=el("button",out,"Создать ссылку");make.className="on";
 const link=el("textarea",out);link.rows=4;link.readOnly=true;const open=el("a",out,"");open.target="_blank";
 make.onclick=()=>{const cfg={on:boxes.filter(b=>b[1].checked).map(b=>b[0]),w:w.checked?1:0,tr:tr.checked?1:0,add:rows.filter(r=>r[0].value.trim()).map(r=>[r[0].value.trim(),r[1].value])};
  link.value=location.href.split("#")[0]+"#c="+enc(cfg);open.href=link.value;open.textContent="Открыть и проверить";link.select();
  if(navigator.clipboard)navigator.clipboard.writeText(link.value).then(()=>make.textContent="Ссылка скопирована ✓",()=>{})}}
if(location.hash==="#new")builder();
else if(badLink){$("#view").textContent="Ссылка повреждена или скопирована не целиком. Попросите терапевта прислать её ещё раз.";}
else draw();
</script></body></html>
